; Battle Lab local hotfixes (served through /fortnite/api/cloudstorage/system like Epic's hotfix files).
; Every value here must be traceable to data shipped in the 12.50 paks, or be marked as a local choice. Source is noted per block.

[/Script/FortniteGame.FortGameInstance]
; Shipped FrontEndPlaylistData mechanism; original asset supplies rules/UI.
!FrontEndPlaylistData=ClearArray
+FrontEndPlaylistData=(PlaylistName=Playlist_BattleLab,PlaylistAccess=(bEnabled=true,bIsDefaultPlaylist=true,bVisibleWhenDisabled=true,AdvertiseType=None,bDisplayAsLimitedTime=false,DisplayPriority=0,CategoryIndex=0))

[AssetHotfix]
; Bot Grenades (Friendly/Enemy). The cooked composite AthenaCompositeLP_BattleLab has these 6 rows at Weight 0.0.
; Epic's own re-enable values are in /Game/Athena/Playlists/BattleLab/LootOverrides/OverrideLootPackagesDataBackup_Exp
; (the same 6 rows, Weight 2.0, Count 5). Applied here to the composite table the playlist uses.
; Local choice: the Friendly grenade rows (.50 / .60 / supply .50) use 6.0 instead of Epic's 2.0, so friendlies drop
; about three times as often as enemies. Set them back to 2.0 for Epic's original odds.
+DataTable=/Game/Athena/Playlists/BattleLab/AthenaCompositeLP_BattleLab;RowUpdate;WorldList.AthenaConsumables.50;Weight;6.0
+DataTable=/Game/Athena/Playlists/BattleLab/AthenaCompositeLP_BattleLab;RowUpdate;WorldList.AthenaConsumables.51;Weight;2.0
+DataTable=/Game/Athena/Playlists/BattleLab/AthenaCompositeLP_BattleLab;RowUpdate;WorldList.AthenaHighConsumables.60;Weight;6.0
+DataTable=/Game/Athena/Playlists/BattleLab/AthenaCompositeLP_BattleLab;RowUpdate;WorldList.AthenaHighConsumables.61;Weight;2.0
+DataTable=/Game/Athena/Playlists/BattleLab/AthenaCompositeLP_BattleLab;RowUpdate;WorldList.AthenaSupplyDropConsumables.50;Weight;6.0
+DataTable=/Game/Athena/Playlists/BattleLab/AthenaCompositeLP_BattleLab;RowUpdate;WorldList.AthenaSupplyDropConsumables.51;Weight;2.0

